# Unit 0.17 — the first workflow in this repository that runs any code gate.
#
# Before this, four workflows existed (db-backup, db-migrate, db-restore-drill,
# db-role-inventory); every one is workflow_dispatch/schedule and none runs
# vitest, tsc, ESLint or a build. `gh run list` confirms no run has EVER been
# triggered by `pull_request` or `push`. Every gate in every unit so far was
# hand-run by an agent, and the auto-squash-merge flow had nothing behind it.
#
# See docs/CI.md for what gates a PR and how to reproduce each locally.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A force-push or a rapid second push should not leave two runs racing; the
# newest commit is the only one whose verdict matters.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Pattern copied from db-restore-drill.yml (unit 0.1) rather than written
    # fresh — it is a known-working in-repo service block, pinned to the same
    # PostgreSQL 18 the Sliplane server runs.
    # T2 (TEMPORARY): the postgres service block is deliberately REMOVED to prove
    # the anti-vacuity assertion fails loudly instead of degrading to silent skips.

    env:
      # Throwaway credentials for a container that exists for the length of one
      # job on one runner and is reachable only from that runner's localhost.
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/payroll_ci
      # prisma.config.ts resolves migrations through DIRECT_DATABASE_URL, then
      # DATABASE_URL. Both point at the same throwaway container here.
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/payroll_ci
      DIRECT_DATABASE_URL: postgresql://postgres:ci@localhost:5432/payroll_ci
      # Deterministic, and matches the app's Philippine payroll domain.
      TZ: Asia/Manila

    steps:
      - name: Checkout (full history — the lint gate diffs against the base)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Also exercises unit 0.9's `prepare` hook installer and unit 0.2's
      # `postinstall: prisma generate` in a clean environment — if either ever
      # breaks `npm ci`, this step goes red instead of the production build.
      - name: Install dependencies (npm ci)
        run: npm ci

      # T2b (TEMPORARY): ALL database steps and assertions deleted — this is
      # what a naive pipeline looks like. Watch it go GREEN with no database.

      # ── Gate 1: the test suite ──────────────────────────────────────────
      - name: Test suite (vitest)
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: ASSERT zero skipped tests
        run: |
          node -e '
            const r = require("./vitest-results.json");
            const skipped = (r.numPendingTests || 0) + (r.numTodoTests || 0);
            console.log(
              `tests: ${r.numTotalTests} total, ${r.numPassedTests} passed, ` +
              `${r.numFailedTests} failed, ${skipped} skipped`
            );
            if (skipped > 0) {
              console.error(
                "::error::" + skipped + " test(s) were SKIPPED. A green run with skips is a FAILURE: " +
                "it usually means a database-backed suite silently opted out. Fix the environment, " +
                "not the assertion."
              );
              process.exit(1);
            }
            if (r.numTotalTests === 0) {
              console.error("::error::Zero tests ran. The suite did not execute.");
              process.exit(1);
            }
          '

      # ── Gate 2: types ───────────────────────────────────────────────────
      # `next build` is deliberately NOT run here — see docs/CI.md. Measured on
      # a 2-core/7.9 GB box: it compiles in 104s and is then SIGTERM-killed in
      # its TypeScript phase at ~7.0 GB peak. The identical type check standing
      # alone costs 877 MB and passes in 57s. A GitHub-hosted standard runner
      # on a private repo has 2 cores and 7 GB — less headroom than the box
      # that already fails — and a flaky-red gate gets ignored.
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      # ── Gate 3: lint, scoped to what the PR actually changed ────────────
      # `npm run lint` reports 851 problems (772 errors) on pristine main, of
      # which 803 problems / 765 errors are in docs/ design-handoff .jsx
      # mockups that are never built or deployed. src/ carries 48 problems and
      # 7 errors. A whole-repo gate would therefore be red on arrival and get
      # ignored, so the blocking gate is the diff: code you touched must be
      # clean. The repo-wide number is printed for visibility, not enforced.
      - name: Lint changed files (blocking)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable diff base ($BASE) — falling back to the previous commit."
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          if [ -z "$BASE" ]; then
            echo "Still no diff base; skipping the changed-files lint (nothing to compare)."
            exit 0
          fi

          CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.mjs' '*.cjs' | tr '\n' ' ')"
          if [ -z "$CHANGED" ]; then
            echo "No lintable files changed."
            exit 0
          fi

          echo "Linting changed files:"
          printf '  %s\n' $CHANGED
          npx eslint --max-warnings 0 --no-error-on-unmatched-pattern $CHANGED

      - name: Repo-wide lint total (informational, never blocks)
        if: always()
        run: |
          npx eslint --format stylish . > eslint-full.txt 2>&1 || true
          tail -n 3 eslint-full.txt || true
          echo "Informational only — see docs/CI.md for why the whole-repo count is not a gate."
