# Unit 0.17 — the first workflow in this repository that runs any code gate.
#
# Before this, four workflows existed (db-backup, db-migrate, db-restore-drill,
# db-role-inventory); every one is workflow_dispatch/schedule and none runs
# vitest, tsc, ESLint or a build. `gh run list` confirms no run has EVER been
# triggered by `pull_request` or `push`. Every gate in every unit so far was
# hand-run by an agent, and the auto-squash-merge flow had nothing behind it.
#
# See docs/CI.md for what gates a PR and how to reproduce each locally.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# On a PULL REQUEST, a force-push or a rapid second push should not leave two
# runs racing: only the newest commit's verdict matters, so cancel the old one.
#
# On MAIN, never cancel. Every commit on main is a permanent record and deserves
# its own verdict. Unit 0.9 Am 2 proved the cost of getting this wrong: cecd6f3
# was cancelled 43 seconds after it started because the next merge landed, and
# that commit has no result at all. A commit with no result looks identical in a
# run list to one that has not run yet, and neither is a green tick — the same
# vacuity trap as a green suite full of skips, wearing a different costume.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Pattern copied from db-restore-drill.yml (unit 0.1) rather than written
    # fresh — it is a known-working in-repo service block, pinned to the same
    # PostgreSQL 18 the Sliplane server runs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: payroll_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for a container that exists for the length of one
      # job on one runner and is reachable only from that runner's localhost.
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/payroll_ci
      # prisma.config.ts resolves migrations through DIRECT_DATABASE_URL, then
      # DATABASE_URL. Both point at the same throwaway container here.
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/payroll_ci
      DIRECT_DATABASE_URL: postgresql://postgres:ci@localhost:5432/payroll_ci
      # Deterministic, and matches the app's Philippine payroll domain.
      TZ: Asia/Manila

    steps:
      - name: Checkout (full history — the lint gate diffs against the base)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Also exercises unit 0.9's `prepare` hook installer and unit 0.2's
      # `postinstall: prisma generate` in a clean environment — if either ever
      # breaks `npm ci`, this step goes red instead of the production build.
      - name: Install dependencies (npm ci)
        run: npm ci

      # ────────────────────────────────────────────────────────────────────
      # THE ANTI-VACUITY GATE (B3).
      #
      # A test suite that quietly skips its database-backed cases when the
      # service block is broken is worse than no CI at all: it is a green tick
      # that means nothing. Three layers, because checking the variable alone
      # would only catch the least likely failure:
      #
      #   1. TEST_DATABASE_URL is set and non-empty.
      #   2. The database actually ANSWERS — a service block can start and
      #      still be unusable (wrong port, wrong database, wrong password).
      #   3. After the suite runs, the skip count must be ZERO (below).
      #
      # Layer 3 is the one that holds when someone later adds a DB-backed test
      # with its own skip guard. Today the suite has no skip-gated tests at all
      # (measured: 0 `skipIf`/`runIf`/`describe.skip`), so layers 1–2 are what
      # keep the database honest and layer 3 keeps it that way.
      # ────────────────────────────────────────────────────────────────────
      - name: ASSERT TEST_DATABASE_URL is set
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "::error::TEST_DATABASE_URL is empty. The test suite must NEVER run without a database — a broken service block would degrade to silent skips and this gate would be vacuous."
            exit 1
          fi
          # Print the host/port only. Never echo the whole URL.
          echo "TEST_DATABASE_URL is set (host: $(printf '%s' "$TEST_DATABASE_URL" | sed -E 's|.*@([^/]*)/.*|\1|'))"

      - name: ASSERT the database actually answers
        run: |
          node -e '
            const { Client } = require("pg");
            const c = new Client({ connectionString: process.env.TEST_DATABASE_URL });
            c.connect()
              .then(() => c.query("select version()"))
              .then((r) => { console.log("connected:", r.rows[0].version.split(",")[0]); return c.end(); })
              .catch((e) => {
                // pg raises an AggregateError for a refused connection whose
                // own `.message` is empty — the useful text is in .code and in
                // the nested .errors. T2 proved this fires; it must also SAY
                // something when it does.
                const detail =
                  [e.code, e.message, ...(e.errors || []).map((x) => x.code || x.message)]
                    .filter(Boolean)
                    .join(" ") || String(e);
                console.error("::error::Database at TEST_DATABASE_URL did not answer: " + detail);
                process.exit(1);
              });
          '

      # The migration set is NOT self-contained: 35 statements across
      # prisma/migrations GRANT to `payroll_app`, and the admin_bypass policies
      # reference `owner`. Neither role exists in a fresh container, so
      # `migrate deploy` dies on migration 4 of 87 with
      # `ERROR: role "payroll_app" does not exist` (found by this pipeline's
      # very first run). Same idempotent pre-creation the restore drill uses —
      # scripts/restore-from-backup.md:48-50 — so CI and the drill agree.
      # No password: these are NOLOGIN grant targets inside a throwaway
      # container, never authenticated against.
      - name: Pre-create the roles the migrations GRANT to
        run: |
          node -e '
            const { Client } = require("pg");
            const roles = ["owner", "payroll_app", "sentire_books_app"];
            const c = new Client({ connectionString: process.env.TEST_DATABASE_URL });
            (async () => {
              await c.connect();
              for (const r of roles) {
                await c.query(
                  `DO $$ BEGIN CREATE ROLE "${r}"; EXCEPTION WHEN duplicate_object THEN NULL; END $$;`
                );
                console.log("role ready:", r);
              }
              await c.end();
            })().catch((e) => {
              console.error("::error::Could not pre-create migration roles: " + e.message);
              process.exit(1);
            });
          '

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: ASSERT no migration is pending
        run: npx prisma migrate status

      # ── Gate 1: the test suite ──────────────────────────────────────────
      - name: Test suite (vitest)
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: ASSERT zero skipped tests
        run: |
          node -e '
            const r = require("./vitest-results.json");
            const skipped = (r.numPendingTests || 0) + (r.numTodoTests || 0);
            console.log(
              `tests: ${r.numTotalTests} total, ${r.numPassedTests} passed, ` +
              `${r.numFailedTests} failed, ${skipped} skipped`
            );
            if (skipped > 0) {
              console.error(
                "::error::" + skipped + " test(s) were SKIPPED. A green run with skips is a FAILURE: " +
                "it usually means a database-backed suite silently opted out. Fix the environment, " +
                "not the assertion."
              );
              process.exit(1);
            }
            if (r.numTotalTests === 0) {
              console.error("::error::Zero tests ran. The suite did not execute.");
              process.exit(1);
            }
          '

      # ── Gate 2: types ───────────────────────────────────────────────────
      # `next build` is deliberately NOT run here — see docs/CI.md. Measured on
      # a 2-core/7.9 GB box: it compiles in 104s and is then SIGTERM-killed in
      # its TypeScript phase at ~7.0 GB peak. The identical type check standing
      # alone costs 877 MB and passes in 57s. A GitHub-hosted standard runner
      # on a private repo has 2 cores and 7 GB — less headroom than the box
      # that already fails — and a flaky-red gate gets ignored.
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      # ── Gate 3: lint, scoped to what the PR actually changed ────────────
      # `npm run lint` reports 851 problems (772 errors) on pristine main, of
      # which 803 problems / 765 errors are in docs/ design-handoff .jsx
      # mockups that are never built or deployed. src/ carries 48 problems and
      # 7 errors. A whole-repo gate would therefore be red on arrival and get
      # ignored, so the blocking gate is the diff: code you touched must be
      # clean. The repo-wide number is printed for visibility, not enforced.
      - name: Lint changed files (blocking)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable diff base ($BASE) — falling back to the previous commit."
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          if [ -z "$BASE" ]; then
            echo "Still no diff base; skipping the changed-files lint (nothing to compare)."
            exit 0
          fi

          CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.mjs' '*.cjs' | tr '\n' ' ')"
          if [ -z "$CHANGED" ]; then
            echo "No lintable files changed."
            exit 0
          fi

          echo "Linting changed files:"
          printf '  %s\n' $CHANGED
          npx eslint --max-warnings 0 --no-error-on-unmatched-pattern $CHANGED

      # Unit 0.23: every `path:NN` citation in docs/** (except the dated,
      # append-only docs/DECISIONS.md) must still resolve to a tracked file and
      # an existing line, and match any `(expects `token`)` written after it.
      - name: Doc citations resolve (blocking)
        run: node scripts/check-doc-refs.mjs --strict

      - name: Repo-wide lint total (informational, never blocks)
        if: always()
        run: |
          npx eslint --format stylish . > eslint-full.txt 2>&1 || true
          tail -n 3 eslint-full.txt || true
          echo "Informational only — see docs/CI.md for why the whole-repo count is not a gate."

  # ════════════════════════════════════════════════════════════════════════
  # SERVER-SIDE SECRET SCAN (unit 0.9 Amendment 2).
  #
  # Unit 0.9 put gitleaks in a pre-commit hook. Two holes remained, both of
  # which only a server-side scan can close:
  #
  #   1. MERGE COMMITS. Git fires `pre-merge-commit` for an automatic merge,
  #      not `pre-commit`, and no such hook is installed. Track B proved it:
  #      a credential committed on a branch with --no-verify, then merged with
  #      no bypass flag at all, landed at exit 0 unblocked.
  #   2. --no-verify itself, and any machine where `npm install` never ran.
  #
  # Runs as its own job so it reports separately and in parallel with `gates`.
  # ════════════════════════════════════════════════════════════════════════
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history — the range scan walks the PR's commits)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Uses the repository's OWN installer, so CI runs the same pinned,
      # sha256-verified gitleaks 8.30.1 as the local hook. If the download or
      # the checksum fails, the script exits non-zero and this step goes red —
      # there is deliberately no `|| true` anywhere in this job.
      - name: Install gitleaks (pinned + checksum-verified, same as the hook)
        id: gitleaks
        run: |
          BIN="$(bash scripts/install-gitleaks.sh | tail -n 1)"
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "::error::gitleaks could not be installed. This job FAILS rather than skipping: a secret scan that silently no-ops is worse than none, because it reports a green tick."
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      # B3: prove the scanner and its config are actually usable before trusting
      # any verdict they produce. Same principle as the zero-skip assertion in
      # unit 0.17 — the tool must be shown to have run, not assumed to have.
      - name: ASSERT gitleaks runs and the config is present
        run: |
          BIN='${{ steps.gitleaks.outputs.bin }}'
          "$BIN" version || { echo "::error::gitleaks binary is present but will not execute."; exit 1; }
          if [ ! -f .gitleaks.toml ]; then
            echo "::error::.gitleaks.toml is missing. CI must scan with the SAME config as the local hook; two configs that drift are worse than one that is imperfect, because a commit that passes locally and fails here teaches people to bypass locally."
            exit 1
          fi
          echo "config: $(wc -l < .gitleaks.toml) lines, $(grep -c '^\[\[rules\]\]' .gitleaks.toml) custom rules on top of the stock set"

      - name: Resolve the commit range this change introduces
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # A branch's first push reports an all-zero "before".
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "$HEAD~1" 2>/dev/null || echo '')"
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "range: ${BASE:-<none>}..$HEAD"

      # THE VACUITY GUARD, and the direct analogue of unit 0.17's zero-skip
      # assertion: an empty commit range scans nothing and passes trivially.
      - name: ASSERT the commit range is non-empty
        run: |
          BASE='${{ steps.range.outputs.base }}'
          HEAD='${{ steps.range.outputs.head }}'
          if [ -z "$BASE" ]; then
            echo "::error::Could not resolve a base commit. Refusing to report a green secret scan over an unknown range."
            exit 1
          fi
          COUNT="$(git rev-list --count "$BASE..$HEAD")"
          echo "$COUNT commit(s) in range"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::The commit range $BASE..$HEAD is EMPTY, so the range scan would pass without inspecting anything. Fix the range, not the assertion."
            exit 1
          fi

      # Scan 1 — the tree we would merge. Catches a secret that is PRESENT in
      # the code, including one committed before this PR and never removed.
      # Measured on main: clean, 5.79 MB in 1.7s.
      - name: Scan the working tree
        run: |
          '${{ steps.gitleaks.outputs.bin }}' dir . \
            --config .gitleaks.toml --no-banner --redact --log-level error \
            --report-format template --report-template .githooks/gitleaks-report.tmpl \
            --report-path -

      # Scan 2 — every commit this change introduces. Catches a secret that was
      # added and then DELETED again within the same PR: the tree is clean but
      # the blob still merges into main's history and is still leaked. Measured
      # locally: the tree scan misses that case, this one catches it. Neither
      # scan is sound alone.
      - name: Scan every commit in the range
        run: |
          '${{ steps.gitleaks.outputs.bin }}' git . \
            --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" \
            --config .gitleaks.toml --no-banner --redact --log-level error \
            --report-format template --report-template .githooks/gitleaks-report.tmpl \
            --report-path -

      # Unit 0.16: the same filename guard the pre-commit hook runs, over the
      # files this range ADDS, so a bypassed or missing hook is caught here.
      - name: Filename guard over files the range adds
        run: node scripts/check-filenames.mjs --range '${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}'

      - name: What to do if this job is red
        if: failure()
        run: |
          cat >&2 <<'EOF'
          A credential was found, or the scanner could not be trusted to run.

            1. Remove the secret and force-push the branch. Deleting it in a
               LATER commit is not enough — the range scan exists because the
               blob still merges into main's history.
            2. If the value is real, ROTATE IT. See docs/RUNBOOK_CREDENTIAL_ROTATION.md.
            3. If it is a false positive, add a narrow entry to .gitleaks.toml
               (path or regex, never a blanket rule) and say why.

          This job cannot be bypassed with --no-verify. That is the point:
          the local hook missed merge commits entirely.
          EOF
          exit 1

  # Unit 0.24: the WHOLE app against a real Postgres, in the production role
  # shape (non-superuser owner migrates; the runtime connects as a login that
  # inherits payroll_app only). See scripts/integration/README.md.
  # ADVISORY (continue-on-error) per REP-4: on main before unit 0.7 lands,
  # scenario S7 is a KNOWN RED (the runtime connects as the owner, #214). Make
  # it blocking once 0.7 is merged and this job has been green on main.
  integration:
    name: integration (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_ADMIN_URL: postgresql://postgres:ci@localhost:5432/postgres
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Integration harness (exit 0 clean, 1 finding, 2 could not run)
        run: npm run test:integration -- --fresh
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: integration-report.json
          if-no-files-found: warn
