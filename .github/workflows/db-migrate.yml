name: DB Migrate (manual break-glass / status)

# Migrations now apply AUTOMATICALLY on every deploy — `prisma migrate deploy`
# runs before `next start` (see scripts/start.sh). This workflow is retained as:
#   • a break-glass way to apply migrations out-of-band, and
#   • a dry-run status check (dry_run=true → `prisma migrate status`).
#
# Requires repo secret MIGRATE_DATABASE_URL = the Sliplane OWNER connection
# string — a DIRECT/session connection (Prisma migrations take a session-scoped
# advisory lock, so a transaction pooler would hang). Prisma reads it via
# DIRECT_DATABASE_URL (see prisma.config.ts); the owner role's admin_bypass
# policy lets ALTER TABLE / backfills touch every tenant's rows.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show migration status (do NOT apply)"
        type: boolean
        default: false

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DIRECT_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard — secret must be set
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "::error::Repo secret MIGRATE_DATABASE_URL is not set."
            exit 1
          fi
          echo "Secret present."

      - name: Install dependencies
        run: npm ci

      - name: Show pending migrations (before)
        run: npx prisma migrate status || true

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: npx prisma migrate deploy

      - name: Verify status (after)
        run: npx prisma migrate status
