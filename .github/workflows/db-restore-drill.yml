name: DB Restore Drill

# Monthly (and on-demand) PROOF that the latest off-platform backup actually
# restores. Pulls the newest encrypted dump from R2, decrypts it, `pg_restore`s
# into a throwaway postgres:18 service (matching the Sliplane server major), and
# asserts the Employee / PayrollSheet / Invoice row counts exactly match the
# dump-time manifest.
#
# "A backup you have never restored is not a backup." This touches ONLY the
# scratch service — never production. See docs/BACKUPS.md and
# scripts/restore-from-backup.md.

# ⚠️ DISABLED — depends on the (currently disabled) db-backup workflow; there is
# no dump in R2 to restore yet. Backups are a HARD Phase-2 launch gate. The
# monthly schedule is removed so it does not fail; still manually dispatchable
# once real backups exist. See the STATUS banner in docs/BACKUPS.md.
on:
  # schedule:
  #   - cron: "0 4 1 * *"   # RE-ENABLE for Phase 2 (1st of each month, 04:00 UTC)
  workflow_dispatch:

concurrency:
  group: db-restore-drill
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
  SCRATCH_DATABASE_URL: postgresql://postgres:scratch@localhost:5432/verifydb
  # Must match the Sliplane server major (18). pg_restore/psql via absolute path
  # so the runner's older default binaries on PATH can't shadow v18.
  PG_BIN: /usr/lib/postgresql/18/bin

jobs:
  restore-drill:
    runs-on: [self-hosted, sentire]
    services:
      scratch:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: verifydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Guard — required secrets present
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          for v in BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION BACKUP_GPG_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::repo secret for $v is not set"; exit 1; fi
          done

      - name: Install PostgreSQL 18 client, gpg and aws-cli
        run: |
          bash scripts/db/install-ci-db-tools.sh
          "$PG_BIN/pg_restore" --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure aws-cli for R2 (path-style addressing)
        run: aws configure set default.s3.addressing_style path

      - name: Download newest dump + manifest
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail
          KEY="$(aws s3api list-objects-v2 --bucket "$BACKUP_S3_BUCKET" --prefix 'db/' \
                 --endpoint-url "$BACKUP_S3_ENDPOINT" \
                 --query 'reverse(sort_by(Contents[?ends_with(Key, `.dump.gpg`)], &LastModified))[0].Key' \
                 --output text)"
          if [ -z "$KEY" ] || [ "$KEY" = "None" ]; then
            echo "::error::no *.dump.gpg found in bucket — has the backup workflow run yet?"; exit 1
          fi
          MANIFEST="${KEY%.gpg}.manifest.json"
          echo "Newest dump: $KEY"
          aws s3 cp "s3://${BACKUP_S3_BUCKET}/${KEY}"      db.dump.gpg   --endpoint-url "$BACKUP_S3_ENDPOINT"
          aws s3 cp "s3://${BACKUP_S3_BUCKET}/${MANIFEST}" manifest.json --endpoint-url "$BACKUP_S3_ENDPOINT"

      - name: Decrypt
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$BACKUP_GPG_PASSPHRASE" \
              -o db.dump -d db.dump.gpg

      - name: Pre-create prod roles in scratch (so policies/grants restore cleanly)
        run: |
          # Roles the live Sliplane dump references, confirmed via the
          # db-role-inventory diagnostic: the admin_bypass policy is TO "owner",
          # and GRANTs go to payroll_app / sentire_books_app. --no-owner remaps
          # ownership to the scratch superuser, so these only need to EXIST for the
          # CREATE POLICY / GRANT statements to restore without error.
          for r in owner payroll_app sentire_books_app; do
            "$PG_BIN/psql" "$SCRATCH_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
              "DO \$\$ BEGIN CREATE ROLE \"$r\"; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;"
          done

      - name: Restore into scratch
        run: |
          # --no-owner: objects owned by the scratch superuser (which bypasses the
          # restored RLS policies), so the verifier sees every row. Non-fatal
          # warnings are fine — the count verifier below is the authoritative gate.
          "$PG_BIN/pg_restore" --no-owner -d "$SCRATCH_DATABASE_URL" db.dump \
            || echo "pg_restore finished with warnings (non-fatal; verifier is the gate)"

      - name: Verify restored row counts vs manifest
        env:
          BACKUP_MANIFEST_FILE: manifest.json
        run: npx tsx scripts/verify-backup.ts

      - name: Extension parity check
        run: |
          echo "Extensions present in the restored scratch DB:"
          "$PG_BIN/psql" "$SCRATCH_DATABASE_URL" -tAc "SELECT extname FROM pg_extension ORDER BY 1"
          echo "Production declares no non-default extensions (no CREATE EXTENSION in prisma/migrations),"
          echo "so the stock postgres:18 image restores it faithfully. If prod ever adds one, install it here."
